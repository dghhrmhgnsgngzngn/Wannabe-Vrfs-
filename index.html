<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My VR Stadium</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#111; color:white; }
    #help { position:fixed; z-index:5; top:12px; left:12px; right:12px;
      padding:12px 14px; background:#111d; border-radius:10px; font-size:14px; }
  </style>
</head>
<body>
  <div id="help">My VR Stadium · On Meta Quest, open this page in the Quest Browser and press the VR button.</div>
  <a-scene
    renderer="colorManagement: true; physicallyCorrectLights: true"
    background="color: #87b9d8"
    vr-mode-ui="enabled: true"
    webxr="optionalFeatures: local-floor, bounded-floor">
    <a-assets timeout="60000">
      <a-asset-item id="stadium" src="./football-stadium.glb"></a-asset-item>
    </a-assets>
    <a-entity light="type: ambient; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; intensity: 1.4" position="2 8 4"></a-entity>
    <a-entity id="stadium-model" gltf-model="#stadium" position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-entity>
    <a-entity id="rig" position="0 1.6 8">
      <a-camera wasd-controls="acceleration: 18" look-controls="pointerLockEnabled: false">
        <a-cursor color="#ffffff" opacity="0.6"></a-cursor>
      </a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
